services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agendamento
      POSTGRES_USER: agendamento
      POSTGRES_PASSWORD: agendamento
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendamento -d agendamento"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/agendamento
      DB_USER: agendamento
      DB_PASSWORD: agendamento
      APP_TIMEZONE: America/Sao_Paulo
    ports:
      - "8080:8080"

volumes:
  pgdata:
